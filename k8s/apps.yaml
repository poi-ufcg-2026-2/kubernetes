
# ==========================================
# CPU-bound
# ==========================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-bound
  labels:
    app: cpu-bound
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-bound
  template:
    metadata:
      labels:
        app: cpu-bound
    spec:
      containers:
        - name: cpu-bound
          image: rayanne9/image-restoration:1.0
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: THREADS
              value: "1"
            - name: METRICS_INTERVAL_S
              value: "5"
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
          volumeMounts:
            - name: logs
              mountPath: /logs
      volumes:
        - name: logs
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: cpu-bound
spec:
  type: NodePort
  selector:
    app: cpu-bound
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080

---
# ==========================================
# Memory-bound
# ==========================================

