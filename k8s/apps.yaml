  name: memory-bound
spec:
  type: NodePort
  selector:
    app: memory-bound
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081

---
# ==========================================
# IO-bound
# ==========================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: io-bound
  labels:
    app: io-bound
spec:
  replicas: 1
  selector:
    matchLabels:
      app: io-bound
  template:
    metadata:
      labels:
        app: io-bound
    spec:
      containers:
        - name: io-bound
          image: marciathais/bytesum-api:1.0
          ports:
            - containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            - name: WORKERS
              value: "1"
            - name: THREAD_LIMIT
              value: "8"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
          volumeMounts:
            - name: logs
              mountPath: /logs
      volumes:
        - name: logs
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: io-bound
spec:
  type: NodePort
  selector:
    app: io-bound
  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 30082
